<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat | Gemini Clone</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a202c; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }

        /* Markdown Styles within Chat */
        .prose pre { background: #1a202c; padding: 10px; border-radius: 8px; overflow-x: auto; }
        .prose code { color: #e2e8f0; font-family: monospace; }
        .prose p { margin-bottom: 0.5rem; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        
        /* Mobile Overlay Transition */
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        
        /* Loading Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
            height: 6px; width: 6px; background-color: #a0aec0; border-radius: 50%; display: inline-block; margin: 0 1px;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen w-screen overflow-hidden flex text-sm md:text-base">

    <!-- Mobile Overlay (Backdrop) -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:relative z-30 w-72 h-full bg-gray-950 flex flex-col border-r border-gray-800 sidebar-transition transform -translate-x-full md:translate-x-0">
        
        <!-- Sidebar Header -->
        <div class="p-4 flex items-center justify-between">
            <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-200 py-3 px-4 rounded-full transition-all duration-200 border border-gray-700">
                <i class="ph ph-plus text-lg"></i>
                <span class="font-medium">New Chat</span>
            </button>
        </div>

        <!-- History List -->
        <div class="flex-1 overflow-y-auto px-2" id="chat-history-list">
            <!-- Chat items injected here -->
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-gray-800">
            <button onclick="openSettings()" class="flex items-center gap-3 w-full p-3 hover:bg-gray-800 rounded-lg transition-colors text-gray-400 hover:text-white">
                <i class="ph ph-gear text-xl"></i>
                <span>Settings</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full relative w-full">
        
        <!-- Header (Mobile Toggle + Title) -->
        <header class="h-14 flex items-center justify-between px-4 border-b border-gray-800 bg-gray-900/95 backdrop-blur z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-gray-400 hover:text-white">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <span id="current-model-display" class="text-gray-400 text-xs md:text-sm font-mono bg-gray-800 px-2 py-1 rounded">Gemini Pro</span>
            </div>
            <div class="text-gray-400 text-sm font-medium">Universal AI</div>
        </header>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth pb-32">
            <!-- Welcome State -->
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center opacity-100 transition-opacity duration-300">
                <div class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-purple-600 rounded-2xl mb-6 flex items-center justify-center shadow-lg shadow-purple-900/20">
                    <i class="ph ph-sparkle text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl md:text-4xl font-semibold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-gray-100 to-gray-400">Hello, Human.</h1>
                <p class="text-gray-500">How can I help you today?</p>
            </div>
            
            <!-- Messages will be appended here -->
            <div id="messages-list" class="flex flex-col gap-6 max-w-3xl mx-auto w-full hidden"></div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-gray-900 via-gray-900 to-transparent pt-10 pb-6 px-4">
            <div class="max-w-3xl mx-auto relative bg-gray-800 rounded-2xl border border-gray-700 shadow-xl focus-within:border-gray-500 focus-within:ring-1 focus-within:ring-gray-500 transition-all">
                <textarea 
                    id="user-input" 
                    rows="1" 
                    placeholder="Message Universal AI..." 
                    class="w-full bg-transparent text-white p-4 pr-12 rounded-2xl focus:outline-none resize-none overflow-hidden max-h-48 leading-relaxed"
                    oninput="autoResize(this)"
                    onkeydown="handleEnter(event)"
                ></textarea>
                <button onclick="sendMessage()" id="send-btn" class="absolute right-2 bottom-2 p-2 bg-white text-black rounded-full hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="ph ph-paper-plane-right text-lg"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <p class="text-xs text-gray-500">AI can make mistakes. Check important info.</p>
            </div>
        </div>
    </main>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl shadow-2xl p-6 m-4 transform transition-all scale-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Settings</h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" placeholder="sk-or-..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Key is stored locally in your browser.</p>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Model Name</label>
                    <input type="text" id="model-input" placeholder="google/gemini-2.0-flash-001" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Default: google/gemini-2.0-flash-001</p>
                </div>
            </div>

            <div class="mt-8 flex justify-end">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-medium transition-colors">Save</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- State Management ---
        const APP_STATE = {
            chats: JSON.parse(localStorage.getItem('universal_ai_chats')) || [],
            currentChatId: null,
            config: {
                apiKey: localStorage.getItem('universal_ai_key') || '',
                model: localStorage.getItem('universal_ai_model') || 'google/gemini-2.0-flash-001'
            }
        };

        // --- DOM Elements ---
        const els = {
            input: document.getElementById('user-input'),
            messagesList: document.getElementById('messages-list'),
            chatContainer: document.getElementById('chat-container'),
            welcomeScreen: document.getElementById('welcome-screen'),
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('mobile-overlay'),
            historyList: document.getElementById('chat-history-list'),
            modelDisplay: document.getElementById('current-model-display'),
            settingsModal: document.getElementById('settings-modal'),
            apiKeyInput: document.getElementById('api-key-input'),
            modelInput: document.getElementById('model-input'),
            sendBtn: document.getElementById('send-btn')
        };

        // --- Initialization ---
        function init() {
            renderHistory();
            els.modelDisplay.innerText = APP_STATE.config.model.split('/').pop(); // Show short name
            
            // Check for API Key
            if (!APP_STATE.config.apiKey) {
                setTimeout(openSettings, 500);
            }

            // Load last chat if exists
            if (APP_STATE.chats.length > 0) {
                loadChat(APP_STATE.chats[0].id);
            } else {
                createNewChat(false);
            }
        }

        // --- Sidebar Logic ---
        function toggleSidebar() {
            const isClosed = els.sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                els.sidebar.classList.remove('-translate-x-full');
                els.overlay.classList.remove('hidden');
            } else {
                els.sidebar.classList.add('-translate-x-full');
                els.overlay.classList.add('hidden');
            }
        }

        function renderHistory() {
            els.historyList.innerHTML = '';
            
            // Sort by date (newest first)
            const sortedChats = [...APP_STATE.chats].sort((a,b) => b.timestamp - a.timestamp);

            sortedChats.forEach(chat => {
                const isActive = chat.id === APP_STATE.currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-3 mb-1 rounded-lg cursor-pointer transition-colors ${isActive ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800/50 hover:text-gray-200'}`;
                div.onclick = () => { loadChat(chat.id); if(window.innerWidth < 768) toggleSidebar(); };
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i class="ph ph-chat-circle text-lg"></i>
                        <span class="truncate text-sm font-medium w-40">${chat.title}</span>
                    </div>
                    <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition-opacity">
                        <i class="ph ph-trash"></i>
                    </button>
                `;
                els.historyList.appendChild(div);
            });
        }

        // --- Chat Logic ---
        function createNewChat(shouldRender = true) {
            APP_STATE.currentChatId = Date.now().toString();
            els.welcomeScreen.classList.remove('hidden');
            els.messagesList.classList.add('hidden');
            els.messagesList.innerHTML = '';
            els.input.value = '';
            els.input.style.height = 'auto';
            if(window.innerWidth < 768 && !els.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
            if(shouldRender) renderHistory();
        }

        function loadChat(id) {
            APP_STATE.currentChatId = id;
            const chat = APP_STATE.chats.find(c => c.id === id);
            if (!chat) return;

            els.welcomeScreen.classList.add('hidden');
            els.messagesList.classList.remove('hidden');
            els.messagesList.innerHTML = '';

            chat.messages.forEach(msg => appendMessageToUI(msg.role, msg.content));
            renderHistory();
            scrollToBottom();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if(!confirm('Delete this chat?')) return;
            
            APP_STATE.chats = APP_STATE.chats.filter(c => c.id !== id);
            saveData();
            
            if (APP_STATE.currentChatId === id) {
                createNewChat();
            } else {
                renderHistory();
            }
        }

        // --- Messaging Core ---
        async function sendMessage() {
            const text = els.input.value.trim();
            if (!text) return;
            if (!APP_STATE.config.apiKey) {
                alert("Please set your OpenRouter API Key in settings.");
                openSettings();
                return;
            }

            // 1. Reset Input
            els.input.value = '';
            els.input.style.height = 'auto';
            
            // 2. Hide Welcome, Show List
            els.welcomeScreen.classList.add('hidden');
            els.messagesList.classList.remove('hidden');

            // 3. Add User Message
            appendMessageToUI('user', text);
            updateChatState('user', text);

            // 4. Create AI Placeholder
            const loadingId = appendLoadingIndicator();
            scrollToBottom();

            // 5. API Call
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${APP_STATE.config.apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: APP_STATE.config.model,
                        messages: getContextForApi()
                    })
                });

                const data = await response.json();
                
                // Remove Loading
                document.getElementById(loadingId).remove();

                if (data.error) throw new Error(data.error.message);
                
                const aiContent = data.choices?.[0]?.message?.content || "No response received.";
                
                // 6. Add AI Message
                appendMessageToUI('assistant', aiContent);
                updateChatState('assistant', aiContent);

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                appendMessageToUI('assistant', `**Error:** ${error.message}. Check your API Key.`);
            }
        }

        function getContextForApi() {
            // Get current chat history for context
            const chat = APP_STATE.chats.find(c => c.id === APP_STATE.currentChatId);
            return chat ? chat.messages : [];
        }

        function updateChatState(role, content) {
            let chat = APP_STATE.chats.find(c => c.id === APP_STATE.currentChatId);
            
            if (!chat) {
                // First message creates the chat object
                chat = {
                    id: APP_STATE.currentChatId,
                    title: content.slice(0, 30) + (content.length > 30 ? '...' : ''),
                    timestamp: Date.now(),
                    messages: []
                };
                APP_STATE.chats.unshift(chat);
            } else {
                // Update timestamp for sorting
                chat.timestamp = Date.now();
            }

            chat.messages.push({ role, content });
            saveData();
            renderHistory();
        }

        function saveData() {
            localStorage.setItem('universal_ai_chats', JSON.stringify(APP_STATE.chats));
        }

        // --- UI Rendering Helpers ---
        function appendMessageToUI(role, text) {
            const div = document.createElement('div');
            const isUser = role === 'user';
            
            div.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            
            // Render Markdown safely
            const parsedContent = marked.parse(text);

            div.innerHTML = `
                <div class="flex gap-4 max-w-[85%] md:max-w-[75%] ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center ${isUser ? 'bg-white' : 'bg-blue-600'}">
                        <i class="ph ${isUser ? 'ph-user text-black' : 'ph-sparkle text-white'} text-lg"></i>
                    </div>
                    <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'}">
                        <div class="px-5 py-3.5 rounded-2xl shadow-sm prose prose-invert max-w-none text-sm md:text-base leading-relaxed break-words ${isUser ? 'bg-gray-800 text-gray-100 rounded-tr-sm' : 'bg-transparent text-gray-100 pl-0'}">
                            ${parsedContent}
                        </div>
                    </div>
                </div>
            `;
            els.messagesList.appendChild(div);
            scrollToBottom();
        }

        function appendLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = `flex w-full justify-start animate-pulse`;
            div.innerHTML = `
                 <div class="flex gap-4 max-w-[85%]">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center">
                        <i class="ph ph-sparkle text-white text-lg"></i>
                    </div>
                    <div class="flex items-center h-full pt-2">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            els.messagesList.appendChild(div);
            return id;
        }

        function scrollToBottom() {
            els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handle
