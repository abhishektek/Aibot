<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        pre { background: #1e1e1e; color: #dcdcdc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex overflow-hidden">

    <aside id="sidebar" class="w-64 bg-gray-950 flex-shrink-0 flex flex-col border-r border-gray-800 transition-all duration-300">
        <div class="p-4">
            <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white py-2 px-4 rounded-full transition">
                <i class="fa-plus fa-sm"></i> New Chat
            </button>
        </div>
        <div id="chat-list" class="flex-1 overflow-y-auto custom-scrollbar px-2 space-y-1">
            </div>
        <div class="p-4 border-t border-gray-800">
            <button onclick="toggleSettings(true)" class="flex items-center gap-3 w-full p-2 hover:bg-gray-800 rounded-lg transition">
                <i class="fa-gear text-gray-400"></i> Settings
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative">
        <header class="h-16 border-b border-gray-800 flex items-center justify-between px-6 bg-gray-900/50 backdrop-blur">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white"><i class="fa-bars"></i></button>
                <h2 id="current-chat-title" class="font-medium">New Conversation</h2>
            </div>
            <div id="model-badge" class="text-xs bg-blue-900/30 text-blue-400 px-2 py-1 rounded border border-blue-800">
                google/gemini-2.0-flash-001
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar">
            <div id="welcome-view" class="h-full flex flex-col items-center justify-center text-center space-y-4">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                    <i class="fa-robot text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-200">How can I help you today?</h1>
                <p class="text-gray-500 max-w-md">Enter your API key in settings to start chatting with any model via OpenRouter.</p>
            </div>
        </div>

        <div class="p-4 bg-gradient-to-t from-gray-900 via-gray-900 to-transparent">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="user-input" rows="1" 
                    class="w-full bg-gray-800 border border-gray-700 rounded-2xl py-4 pl-4 pr-14 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none overflow-hidden"
                    placeholder="Message Gemini..."></textarea>
                <button id="send-btn" onclick="handleSendMessage()" 
                    class="absolute right-3 bottom-3 p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-paper-plane"></i>
                </button>
            </div>
            <p class="text-center text-[10px] text-gray-600 mt-2">AI can make mistakes. Check important info.</p>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Settings</h3>
                <button onclick="toggleSettings(false)" class="text-gray-400 hover:text-white"><i class="fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Model Name</label>
                    <input type="text" id="model-input" placeholder="google/gemini-2.0-flash-001" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg font-bold transition mt-4">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let chats = JSON.parse(localStorage.getItem('universal_ai_chats')) || [];
        let currentChatId = null;
        let config = JSON.parse(localStorage.getItem('universal_ai_config')) || {
            apiKey: '',
            model: 'google/gemini-2.0-flash-001'
        };

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatList = document.getElementById('chat-list');
        const welcomeView = document.getElementById('welcome-view');
        const settingsModal = document.getElementById('settings-modal');

        // Initial Load
        window.onload = () => {
            document.getElementById('api-key-input').value = config.apiKey;
            document.getElementById('model-input').value = config.model;
            document.getElementById('model-badge').innerText = config.model;
            renderChatList();
            
            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        };

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('w-64');
            sb.classList.toggle('w-0');
            sb.classList.toggle('opacity-0');
        }

        function toggleSettings(show) {
            settingsModal.classList.toggle('hidden', !show);
        }

        function saveSettings() {
            config.apiKey = document.getElementById('api-key-input').value;
            config.model = document.getElementById('model-input').value || 'google/gemini-2.0-flash-001';
            localStorage.setItem('universal_ai_config', JSON.stringify(config));
            document.getElementById('model-badge').innerText = config.model;
            toggleSettings(false);
            alert('Settings Saved!');
        }

        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: 'New Conversation',
                messages: []
            };
            chats.unshift(newChat);
            saveChats();
            loadChat(newChat.id);
        }

        function saveChats() {
            localStorage.setItem('universal_ai_chats', JSON.stringify(chats));
            renderChatList();
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            document.getElementById('current-chat-title').innerText = chat.title;
            welcomeView.classList.add('hidden');
            renderMessages();
        }

        function renderChatList() {
            chatList.innerHTML = chats.map(chat => `
                <div onclick="loadChat(${chat.id})" class="p-3 rounded-lg cursor-pointer transition ${currentChatId === chat.id ? 'bg-gray-800' : 'hover:bg-gray-900'} group flex justify-between items-center">
                    <span class="truncate text-sm w-40">${chat.title}</span>
                    <button onclick="deleteChat(event, ${chat.id})" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400">
                        <i class="fa-trash-can fa-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = null;
                chatContainer.innerHTML = '';
                welcomeView.classList.remove('hidden');
            }
            saveChats();
        }

        function renderMessages() {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            chatContainer.innerHTML = chat.messages.map(msg => `
                <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[85%] rounded-2xl px-4 py-3 ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-100'} shadow-sm">
                        <div class="text-xs mb-1 opacity-50 uppercase font-bold">${msg.role}</div>
                        <div class="prose prose-invert whitespace-pre-wrap">${msg.content}</div>
                    </div>
                </div>
            `).join('');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || !config.apiKey) {
                if(!config.apiKey) alert("Please add your API Key in Settings!");
                return;
            }

            if (!currentChatId) createNewChat();
            
            const chat = chats.find(c => c.id === currentChatId);
            
            // Set title if it's the first message
            if (chat.messages.length === 0) chat.title = text.substring(0, 30) + '...';

            chat.messages.push({ role: 'user', content: text });
            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();

            // Loading state
            const loadingMsg = { role: 'assistant', content: '...' };
            chat.messages.push(loadingMsg);
            renderMessages();

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${config.apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": config.model,
                        "messages": chat.messages.slice(0, -1) // Exclude the "..." loading message
                    })
                });

                const data = await response.json();
                chat.messages[chat.messages.length - 1].content = data.choices[0].message.content;
            } catch (error) {
                chat.messages[chat.messages.length - 1].content = "Error: Could not connect to API. Check your key and model name.";
            }

            saveChats();
            renderMessages();
        }

        // Enter to send (Shift+Enter for newline)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
